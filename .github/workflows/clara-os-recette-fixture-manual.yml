name: Clara OS Recette — manual fictional session

on:
  pull_request:
    paths:
      - '.github/workflows/clara-os-recette-fixture-manual.yml'
  workflow_dispatch:
    inputs:
      confirm_branch:
        description: 'Type the exact isolated Neon branch ID'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: clara-os-recette-fixture
  cancel-in-progress: false

jobs:
  offline-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable reviewed fixture implementation
        uses: actions/checkout@v4
        with:
          ref: 044ac71ce3a339f0e8f2ab729f65d1117ad94924
          persist-credentials: false
      - name: Verify immutable source
        run: test "$(git rev-parse HEAD)" = "044ac71ce3a339f0e8f2ab729f65d1117ad94924"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Run isolated provisioning tests
        run: node --import tsx --test src/tests/recette-provisioning-http-contract.test.ts src/tests/recette-auth-provisioning.test.ts
  provision:
    needs: offline-security-tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_branch == 'br-crimson-feather-b2zr00sf' }}
    runs-on: ubuntu-latest
    environment: clara-os-recette-fixture
    timeout-minutes: 10
    steps:
      - name: Checkout immutable reviewed fixture implementation
        uses: actions/checkout@v4
        with:
          ref: 044ac71ce3a339f0e8f2ab729f65d1117ad94924
          persist-credentials: false
      - name: Verify immutable source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "044ac71ce3a339f0e8f2ab729f65d1117ad94924"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Targeted offline security and provisioning tests (disposable PostgreSQL only)
        run: |
          node --import tsx --test src/tests/recette-provisioning-http-contract.test.ts src/tests/recette-auth-provisioning.test.ts
      - name: Read-only preflight with sanitized failure category
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.RECETTE_LIMITED_DATABASE_URL }}
          RECETTE_FIXTURE_SESSION_TOKEN: ${{ secrets.RECETTE_FIXTURE_SESSION_TOKEN }}
          VERCEL: '1'
          VERCEL_TARGET_ENV: clara-os-recette
          CLARA_RECETTE_MODE: isolated-v1
          CLARA_RECETTE_NEON_BRANCH_ID: br-crimson-feather-b2zr00sf
          CLARA_RECETTE_NEON_HOST: ep-aged-forest-b2wayach.c-6.eu-central-1.aws.neon.tech
          GITHUB_ACTIONS: 'true'
          GITHUB_EVENT_NAME: workflow_dispatch
        run: |
          node --import tsx --input-type=module -e '
            import { neon } from "@neondatabase/serverless";
            import { preflightRecetteFixture } from "./src/lib/recette/fixture-provisioning.ts";
            const allowed = new Set([
              "RECETTE_CONFIGURATION_REFUSED",
              "RECETTE_ENDPOINT_BRANCH_UNPROVEN",
              "RECETTE_PROVISIONING_ROLE_REFUSED",
              "RECETTE_PROVISIONING_CAPABILITIES_REQUIRED",
              "RECETTE_PROVISIONING_PRIVILEGES_REQUIRED"
            ]);
            try {
              await preflightRecetteFixture(process.env, neon(process.env.DATABASE_URL ?? ""), fetch);
              console.log("RECETTE_READ_ONLY_PREFLIGHT_OK");
            } catch (error) {
              const raw = error instanceof Error ? error.message : "";
              const code = [...allowed].find(item => raw === item) ??
                (raw.startsWith("RECETTE_DATABASE_REFUSED") ? "RECETTE_DATABASE_REFUSED" : "RECETTE_PREFLIGHT_SQL_OR_TRANSPORT_FAILED");
              console.error("RECETTE_PREFLIGHT_CATEGORY=" + code);
              process.exitCode = 1;
            }
          '
      - name: Provision fictional session on isolated branch
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.RECETTE_LIMITED_DATABASE_URL }}
          RECETTE_FIXTURE_SESSION_TOKEN: ${{ secrets.RECETTE_FIXTURE_SESSION_TOKEN }}
          # The existing recetteDatabase guard requires these explicit isolation flags.
          # They do not grant Vercel credentials or deploy anything.
          VERCEL: '1'
          VERCEL_TARGET_ENV: clara-os-recette
          CLARA_RECETTE_MODE: isolated-v1
          CLARA_RECETTE_NEON_BRANCH_ID: br-crimson-feather-b2zr00sf
          CLARA_RECETTE_NEON_HOST: ep-aged-forest-b2wayach.c-6.eu-central-1.aws.neon.tech
          GITHUB_ACTIONS: 'true'
          GITHUB_EVENT_NAME: workflow_dispatch
        run: |
          test -n "$DATABASE_URL"
          test -n "$RECETTE_FIXTURE_SESSION_TOKEN"
          test -n "$CLARA_RECETTE_NEON_HOST"
          node --import tsx src/scripts/provision-recette-fictional.mts --check-cloud --confirm=br-crimson-feather-b2zr00sf
          node --import tsx src/scripts/provision-recette-fictional.mts --apply-cloud --confirm=br-crimson-feather-b2zr00sf
