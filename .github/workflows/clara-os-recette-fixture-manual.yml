name: Clara OS Recette — manual fictional session

on:
  pull_request:
    paths:
      - '.github/workflows/clara-os-recette-fixture-manual.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Choose read-only diagnosis or explicitly authorize fictional provisioning'
        required: true
        type: choice
        default: diagnose
        options:
          - diagnose
          - provision
      confirm_branch:
        description: 'Type the exact isolated Neon branch ID'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: clara-os-recette-fixture
  cancel-in-progress: false

jobs:
  offline-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable reviewed fixture implementation
        uses: actions/checkout@v4
        with:
          ref: d5eddebe564418d76d71ca78d0c66301518775ba
          persist-credentials: false
      - name: Verify immutable source
        run: test "$(git rev-parse HEAD)" = "d5eddebe564418d76d71ca78d0c66301518775ba"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Run isolated provisioning tests
        run: node --import tsx --test src/tests/recette-provisioning-http-contract.test.ts src/tests/recette-auth-provisioning.test.ts
      - name: Verify fixed database refusal labels never expose connection details
        shell: bash
        run: |
          node --import tsx --input-type=module -e '
            import assert from "node:assert/strict";
            import { recetteDatabase } from "./src/lib/recette/policy.ts";
            import { reportRecetteStartupFailure } from "./src/lib/recette/diagnostics.ts";
            const env = {
              VERCEL: "1", VERCEL_TARGET_ENV: "clara-os-recette",
              CLARA_RECETTE_MODE: "isolated-v1",
              CLARA_RECETTE_NEON_BRANCH_ID: "br-crimson-feather-b2zr00sf",
              CLARA_RECETTE_NEON_HOST: "ep-aged-forest-b2wayach.c-6.eu-central-1.aws.neon.tech",
              DATABASE_URL: "postgresql://clara_os_recette_limited:synthetic-secret@ep-aged-forest-b2wayach.c-6.eu-central-1.aws.neon.tech/neondb?sslmode=require&forbidden=synthetic-secret"
            };
            let refusal;
            try { recetteDatabase(env); } catch (error) { refusal = error; }
            assert.equal(refusal?.message, "RECETTE_DATABASE_REFUSED");
            const original = console.error;
            const labels = [];
            console.error = (...parts) => labels.push(parts.join(" "));
            try {
              reportRecetteStartupFailure(refusal, env);
              reportRecetteStartupFailure(refusal, {...env, VERCEL_ENV: "production"});
              reportRecetteStartupFailure(new Error("synthetic-secret"), env);
            } finally { console.error = original; }
            assert.deepEqual(labels, ["[CLARA_RECETTE_STARTUP] RECETTE_DB_QUERY_KEY_FORBIDDEN"]);
            assert.ok(!labels.join("").includes("synthetic-secret"));
          '
  provision:
    needs: offline-security-tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_branch == 'br-crimson-feather-b2zr00sf' }}
    runs-on: ubuntu-latest
    environment: clara-os-recette-fixture
    timeout-minutes: 10
    steps:
      - name: Checkout immutable reviewed fixture implementation
        uses: actions/checkout@v4
        with:
          ref: d5eddebe564418d76d71ca78d0c66301518775ba
          persist-credentials: false
      - name: Verify immutable source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "d5eddebe564418d76d71ca78d0c66301518775ba"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Targeted offline security and provisioning tests (disposable PostgreSQL only)
        run: |
          node --import tsx --test src/tests/recette-provisioning-http-contract.test.ts src/tests/recette-auth-provisioning.test.ts
      - name: Read-only preflight with staged sanitized failure codes
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.RECETTE_LIMITED_DATABASE_URL }}
          VERCEL: '1'
          VERCEL_TARGET_ENV: clara-os-recette
          CLARA_RECETTE_MODE: isolated-v1
          CLARA_RECETTE_NEON_BRANCH_ID: br-crimson-feather-b2zr00sf
          CLARA_RECETTE_NEON_HOST: ep-aged-forest-b2wayach.c-6.eu-central-1.aws.neon.tech
        run: |
          node --import tsx --input-type=module -e '
            let stage = "MODULE_IMPORT";
            let reportSanitizedRefusal;
            const allowed = new Set([
              "RECETTE_CONFIGURATION_REFUSED",
              "RECETTE_ENDPOINT_BRANCH_UNPROVEN",
              "RECETTE_PROVISIONING_ROLE_REFUSED",
              "RECETTE_PROVISIONING_CAPABILITIES_REQUIRED",
              "RECETTE_PROVISIONING_PRIVILEGES_REQUIRED",
              "RECETTE_PROVISIONING_RENEWAL_PRIVILEGE_REQUIRED"
            ]);
            const sqlStates = {
              "28P01": "DB_PASSWORD_AUTH_REJECTED",
              "28000": "DB_AUTHORIZATION_REJECTED",
              "42501": "DB_SQL_PERMISSION_DENIED",
              "42P01": "DB_REQUIRED_TABLE_MISSING",
              "42703": "DB_REQUIRED_COLUMN_MISSING",
              "3D000": "DB_DATABASE_MISSING",
              "53300": "DB_CONNECTIONS_EXHAUSTED",
              "57P03": "DB_COMPUTE_UNAVAILABLE",
              "08001": "DB_CONNECTION_FAILED",
              "08006": "DB_CONNECTION_LOST"
            };
            try {
              const { neon } = await import("@neondatabase/serverless");
              const { preflightRecetteFixture } = await import("./src/lib/recette/fixture-provisioning.ts");
              const { recetteDatabase } = await import("./src/lib/recette/policy.ts");
              const { reportRecetteStartupFailure } = await import("./src/lib/recette/diagnostics.ts");
              reportSanitizedRefusal = reportRecetteStartupFailure;
              stage = "CONFIGURATION";
              recetteDatabase(process.env);
              const query = neon(process.env.DATABASE_URL);
              stage = "CONNECT_SELECT_1";
              await query`SELECT 1 AS ok`;
              let next = 0;
              const stages = ["ROLE", "CAPABILITIES", "COLUMN_GRANTS", "RENEWAL_GRANT"];
              const stagedQuery = (strings, ...values) => {
                stage = stages[next++] ?? "UNEXPECTED_QUERY";
                return query(strings, ...values);
              };
              stage = "PREFLIGHT";
              await preflightRecetteFixture(process.env, stagedQuery, fetch);
              console.log("RECETTE_READ_ONLY_PREFLIGHT_OK");
            } catch (error) {
              const raw = error instanceof Error ? error.message : "";
              // Existing policy logs only allowlisted fixed codes, never URL or error details.
              if (raw === "RECETTE_DATABASE_REFUSED") reportSanitizedRefusal?.(error, process.env);
              const sqlState = typeof error?.code === "string" ? error.code : "";
              const httpStatus = Number(error?.status);
              const statusClass = httpStatus === 401 ? "HTTP_AUTH_REJECTED" :
                httpStatus === 403 ? "HTTP_PERMISSION_REJECTED" :
                httpStatus === 429 ? "HTTP_RATE_LIMITED" :
                [502,503,504].includes(httpStatus) ? "HTTP_BACKEND_UNAVAILABLE" : "";
              const code = [...allowed].find(item => raw === item) ??
                (raw.startsWith("RECETTE_DATABASE_REFUSED") ? "RECETTE_DATABASE_REFUSED" :
                (sqlStates[sqlState] ?? statusClass) ||
                (stage === "MODULE_IMPORT" ? "MODULE_IMPORT_FAILED" :
                error instanceof TypeError ? "TYPE_OR_TRANSPORT_FAILED" : "UNCLASSIFIED_SQL_OR_TRANSPORT"));
              console.error("RECETTE_PREFLIGHT_STAGE=" + stage);
              console.error("RECETTE_PREFLIGHT_CATEGORY=" + code);
              process.exitCode = 1;
            }
          '
      - name: Provision fictional session on isolated branch
        if: ${{ inputs.operation == 'provision' }}
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.RECETTE_LIMITED_DATABASE_URL }}
          RECETTE_FIXTURE_SESSION_TOKEN: ${{ secrets.RECETTE_FIXTURE_SESSION_TOKEN }}
          # The existing recetteDatabase guard requires these explicit isolation flags.
          # They do not grant Vercel credentials or deploy anything.
          VERCEL: '1'
          VERCEL_TARGET_ENV: clara-os-recette
          CLARA_RECETTE_MODE: isolated-v1
          CLARA_RECETTE_NEON_BRANCH_ID: br-crimson-feather-b2zr00sf
          CLARA_RECETTE_NEON_HOST: ep-aged-forest-b2wayach.c-6.eu-central-1.aws.neon.tech
          GITHUB_ACTIONS: 'true'
          GITHUB_EVENT_NAME: workflow_dispatch
        run: |
          test -n "$DATABASE_URL"
          test -n "$RECETTE_FIXTURE_SESSION_TOKEN"
          test -n "$CLARA_RECETTE_NEON_HOST"
          node --import tsx src/scripts/provision-recette-fictional.mts --check-cloud --confirm=br-crimson-feather-b2zr00sf
          node --import tsx src/scripts/provision-recette-fictional.mts --apply-cloud --confirm=br-crimson-feather-b2zr00sf
