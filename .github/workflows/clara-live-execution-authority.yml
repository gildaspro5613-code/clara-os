name: Clara Live execution authority

on:
  push:
    branches:
      - feat/clara-controlled-execute-clean-base-v1
  workflow_dispatch:

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Execution authority contract
        run: npm run connector:clara-live:execution-check
      - name: Physical action store contract
        run: npm run physical-action-store:check
      - name: PostgreSQL physical proposal contract
        run: npm run physical-action-postgres:check
      - name: Physical approval route contract
        run: npm run physical-approval-route:check
