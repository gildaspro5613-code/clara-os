name: Microsoft connector validation

on:
  push:
    branches:
      - feat/microsoft-windows365-connector-v1
  pull_request:
    paths:
      - "src/lib/auth/**"
      - "src/lib/connectors/microsoft/**"
      - "src/app/api/connections/microsoft/**"
      - "src/tests/*workspace*"
      - "src/tests/microsoft-*"
      - "db/migrations/001_authenticated_workspaces.sql"
      - ".github/workflows/microsoft-connector-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Static authentication and Microsoft security tests
        run: |
          npx tsx --test src/tests/authenticated-workspace-session.test.ts src/tests/authenticated-workspaces-migration.test.ts src/tests/workspace-authorization.test.ts src/tests/microsoft-workspace-gate.test.ts
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Production build
        run: npm run build
