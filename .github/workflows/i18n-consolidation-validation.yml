name: Clara OS i18n consolidation validation
on:
  pull_request:
    branches: [consolidation/clara-os-clean-base]
    paths:
      - "src/i18n/**"
      - "src/app/api/clara/chat/route.ts"
      - "src/lib/brain/response-composer.ts"
      - "src/app/telephonie/page.tsx"
      - "src/tests/i18n-consolidation.test.ts"
      - ".github/workflows/i18n-consolidation-validation.yml"
permissions:
  contents: read
jobs:
  i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Five-language parity and response-locale contracts
        run: node --import tsx --test src/tests/i18n-consolidation.test.ts
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Lint changed i18n surfaces
        run: npx eslint src/i18n/response-language.ts src/tests/i18n-consolidation.test.ts src/app/api/clara/chat/route.ts src/lib/brain/response-composer.ts src/app/telephonie/page.tsx
