name: Lighting Console Connections Validate
on:
  push:
    branches: [feat/lighting-console-connections-v1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx --test src/tests/integration/grandma3-lighting-foundation.test.ts src/tests/integration/avolites-titan-foundation.test.ts src/tests/integration/lighting-console-connections-v1.test.ts
      - run: npx tsc --noEmit --pretty false
      - run: npm run build
