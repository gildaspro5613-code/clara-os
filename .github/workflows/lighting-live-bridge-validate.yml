name: Lighting Live Bridge Validate
on:
  push:
    branches: [feat/lighting-live-bridge-v1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx --test src/tests/integration/lighting-onboarding-session-v1.test.ts src/tests/integration/lighting-test-mode-v1.test.ts src/tests/integration/lighting-self-service-onboarding-v1.test.ts src/tests/integration/lighting-self-service-orchestrator-v1.test.ts src/tests/integration/lighting-provider-router-v1.test.ts
      - run: npx tsc --noEmit --pretty false
      - run: npm run build
