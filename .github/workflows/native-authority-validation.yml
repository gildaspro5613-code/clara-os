name: Native resource authority validation
on:
  pull_request:
    branches: [consolidation/clara-os-clean-base]
    paths:
      - 'src/lib/native/**'
      - 'instrumentation.ts'
      - 'src/app/api/clara/**'
      - 'src/app/api/missions/**'
      - 'src/app/api/documents/**'
      - 'src/app/api/contacts/**'
      - 'src/app/api/calendar/**'
      - 'src/app/api/workspace/install/**'
      - 'src/app/api/openai/test/**'
      - 'src/app/api/internal/prospect-e2e-trace/**'
      - 'src/app/**/*.tsx'
      - 'src/tests/native-authority*'
      - 'src/tests/native-runtime*'
      - 'src/tests/helpers/native-runtime*'
      - 'src/components/native/**'
      - 'src/app/api/native/**'
      - 'src/app/api/connections/google/**'
      - 'src/app/api/connections/brevo/**'
      - 'src/app/api/connections/make/**'
      - 'src/tests/operational-reception*'
      - 'db/migrations/012_native_resource_authority.sql'
      - 'db/migrations/013_native_scoped_runtime.sql'
      - '.github/workflows/native-authority-validation.yml'
permissions:
  contents: read
jobs:
  native-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANONICAL_TEST_CONTAINER: clara-canonical-test-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Isolated PostgreSQL fixture only
        run: |
          docker run --detach --name "$CANONICAL_TEST_CONTAINER" -e POSTGRES_PASSWORD=synthetic-test-only postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          for attempt in $(seq 1 30); do
            if docker exec "$CANONICAL_TEST_CONTAINER" pg_isready -U postgres --quiet; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Actual handlers and database isolation, revocation, snapshot and history
        run: node --import tsx --test src/tests/native-authority.test.ts src/tests/native-authority-postgres.test.ts src/tests/native-runtime-postgres.test.ts
      - run: npx tsc --noEmit --pretty false
      - run: npx eslint src/lib/native src/app/api/clara/session src/app/api/native src/components/native src/tests/native-runtime-browser.e2e.mjs src/tests/helpers/native-runtime* src/tests/native-authority.test.ts src/tests/native-authority-postgres.test.ts src/tests/native-runtime-postgres.test.ts
      - name: Optimized local app build in GitHub only
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps chromium
      - name: HTTPS isolated native UI and actual authority, no real providers
        run: |
          export NATIVE_TEST_DATABASE="native_browser_$(node -e 'process.stdout.write(require("crypto").randomUUID().replaceAll("-",""))')"
          node --import tsx src/tests/helpers/native-runtime-browser-fixture.mts "$NATIVE_TEST_DATABASE"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/native-runtime-key.pem -out /tmp/native-runtime-cert.pem -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' -days 1 > /tmp/native-tls-generation.log 2>&1
          DATABASE_URL=postgresql://synthetic:synthetic@documents-e2e.invalid/synthetic OPENAI_API_KEY=synthetic-test-only CLARA_AUTH_APP_ORIGIN=https://127.0.0.1:3060 NODE_OPTIONS="--import=$PWD/src/tests/helpers/native-runtime-browser-preload.mjs" node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3058 > /tmp/native-app.log 2>&1 &
          native_app_pid=$!
          node src/tests/helpers/native-runtime-tls-proxy.mjs > /tmp/native-tls-proxy.log 2>&1 &
          native_tls_pid=$!
          trap 'kill "$native_app_pid" "$native_tls_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --cacert /tmp/native-runtime-cert.pem --fail --silent https://127.0.0.1:3060/clara > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            python - <<'PYDIAG'
          from pathlib import Path
          import re
          for name in ('native-app.log', 'native-tls-proxy.log'):
              value=Path('/tmp/'+name).read_text()[-2500:]
              value=re.sub(r'https?://[^\s]+', '[local URL]', value)
              value=value.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error file=.github/workflows/native-authority-validation.yml,title=Isolated startup '+name+'::'+value)
          PYDIAG
            exit 1
          fi
          NODE_EXTRA_CA_CERTS=/tmp/native-runtime-cert.pem DOCUMENTS_E2E_ORIGIN=https://127.0.0.1:3060 node --test src/tests/native-runtime-browser.e2e.mjs
      - name: Stop isolated fixture
        if: always()
        run: docker rm -f "$CANONICAL_TEST_CONTAINER" || true
