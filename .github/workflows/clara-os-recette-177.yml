name: Clara OS isolated recette deployment
run-name: "Recette #177 — ${{ github.actor }}"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clara-os-recette-177
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: clara-os-recette
    timeout-minutes: 20
    steps:
      - name: Enforce approved source and invocation
        env:
          APPROVED_SHA: 5a97bdb60dc9284c4e11d18f3ec5103901c6778b
          EVENT: ${{ github.event_name }}
        run: |
          test "$EVENT" = "workflow_dispatch"
          test "${{ github.repository }}" = "gildaspro5613-code/clara-os"
          test "${{ github.workflow_ref }}" != ""
      - name: Checkout approved commit, never dispatch ref
        uses: actions/checkout@v4
        with:
          ref: 5a97bdb60dc9284c4e11d18f3ec5103901c6778b
          persist-credentials: false
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "5a97bdb60dc9284c4e11d18f3ec5103901c6778b"
      - name: Validate cloud deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN secret missing"; exit 1; }
      - name: Install Vercel CLI in GitHub runner only
        run: npm install --global vercel@latest
      - name: Pin existing Vercel project without account lookup or project creation
        run: |
          mkdir -p .vercel
          printf '{"projectId":"prj_jLIZqU5V98I4yl8RCbAaoqgM4KNJ","orgId":"team_0BeqOAO8t5oDEBdzHHdekcxv"}\n' > .vercel/project.json
          node -e 'const p=require("./.vercel/project.json"); if(p.projectId!=="prj_jLIZqU5V98I4yl8RCbAaoqgM4KNJ"||p.orgId!=="team_0BeqOAO8t5oDEBdzHHdekcxv") process.exit(1)'
      - name: Deploy only custom recette environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy --yes --target=clara-os-recette --scope melodie-digital --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/recette-url.txt"
          URL="$(tail -n 1 "$RUNNER_TEMP/recette-url.txt")"
          case "$URL" in https://*.vercel.app) ;; *) echo "::error::Unexpected deployment URL"; exit 1;; esac
          echo "Recette URL: $URL"
          {
            echo "### Clara OS — recette isolated"
            echo "- Target: `clara-os-recette`"
            echo "- Approved source: `5a97bdb60dc9284c4e11d18f3ec5103901c6778b`"
            echo "- Deployment URL: $URL"
            echo "- Runtime and Neon connection are **not certified** by this deployment step."
          } >> "$GITHUB_STEP_SUMMARY"
