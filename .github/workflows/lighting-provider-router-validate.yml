name: Lighting Provider Router Validate
on:
  push:
    branches: [feat/lighting-provider-router-v1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx --test src/tests/integration/lighting-provider-router-v1.test.ts src/tests/integration/grandma3-capability-titan-onboarding.test.ts src/tests/integration/magicq-lighting-adapter.test.ts
      - run: npx tsc --noEmit --pretty false
      - run: npm run build
