name: MagicQ Engine Wire

on:
  push:
    branches:
      - feat/magicq-capability-engine-v1

permissions:
  contents: write

jobs:
  wire-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[magicq-wire]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/magicq-capability-engine-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wire MagicQ into CapabilityEngine
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/capabilities/capability-engine.ts')
          s = p.read_text()

          old_import = 'import { MakeConnectorAdapter, MAKE_CAPABILITIES } from "@/lib/connectors/make";\n'
          new_import = old_import + 'import { MAGICQ_CAPABILITIES } from "@/lib/connectors/internal/chamsys/magicq";\nimport { DisabledMagicQLightingExecutor, executeMagicQFixtureIntensityCapability, type MagicQLightingExecutor } from "./magicq-lighting/executor";\n'
          assert old_import in s
          s = s.replace(old_import, new_import, 1)

          old_ctor = '  public constructor(private readonly githubRead = new GitHubReadExecutor()) {}\n'
          new_ctor = '''  public constructor(\n    private readonly githubRead = new GitHubReadExecutor(),\n    private readonly magicqLighting: MagicQLightingExecutor =\n      new DisabledMagicQLightingExecutor(),\n  ) {}\n'''
          assert old_ctor in s
          s = s.replace(old_ctor, new_ctor, 1)

          marker = '      case "github.repository.list":\n'
          assert marker in s
          block = '''      case MAGICQ_CAPABILITIES.FIXTURE_INTENSITY_SET:\n        return executeMagicQFixtureIntensityCapability(\n          this.magicqLighting,\n          request.workspaceId,\n          request.context,\n        );\n\n'''
          s = s.replace(marker, block + marker, 1)
          p.write_text(s)
          PY
      - name: Add isolated execution-route test
        run: |
          cat > src/tests/integration/magicq-capability-engine.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";

          import { getCapabilityPolicy } from "@/lib/capabilities/capability-policy";
          import {
            DisabledMagicQLightingExecutor,
            executeMagicQFixtureIntensityCapability,
            type MagicQLightingExecutor,
          } from "@/lib/capabilities/magicq-lighting/executor";
          import type { MagicQFixtureIntensityRequest } from "@/lib/connectors/internal/chamsys/magicq";

          class FakeMagicQLightingExecutor implements MagicQLightingExecutor {
            public requests: MagicQFixtureIntensityRequest[] = [];

            async setFixtureIntensity(request: MagicQFixtureIntensityRequest) {
              this.requests.push(request);
              return {
                provider: "chamsys" as const,
                connectorId: "chamsys.magicq" as const,
                capability: "lighting.fixture.intensity.set" as const,
                fixtureId: request.fixtureId,
                requestedIntensityPercent: request.intensityPercent,
                dispatched: true,
              };
            }
          }

          test("MagicQ Lighting remains Premium EXECUTE with explicit approval", () => {
            assert.deepEqual(getCapabilityPolicy("lighting.fixture.intensity.set"), {
              accessMode: "execute",
              requiredPlan: "premium",
              approvalPolicy: "required",
              sequential: true,
            });
          });

          test("isolated CapabilityEngine route dispatches a governed MagicQ-shaped request", async () => {
            const fake = new FakeMagicQLightingExecutor();
            const result = await executeMagicQFixtureIntensityCapability(
              fake,
              "workspace-1",
              {
                connectionId: "connection-1",
                fixtureId: "fixture-1",
                intensityPercent: 50,
              },
            );

            assert.equal(result.success, true);
            assert.deepEqual(fake.requests, [{
              workspaceId: "workspace-1",
              connectionId: "connection-1",
              fixtureId: "fixture-1",
              intensityPercent: 50,
            }]);
          });

          test("default MagicQ execution path fails closed while network is disabled", async () => {
            const result = await executeMagicQFixtureIntensityCapability(
              new DisabledMagicQLightingExecutor(),
              "workspace-1",
              {
                connectionId: "connection-1",
                fixtureId: "fixture-1",
                intensityPercent: 50,
              },
            );

            assert.equal(result.success, false);
            assert.equal(result.message, "MAGICQ_NETWORK_DISABLED");
          });

          test("route rejects missing workspace and malformed context", async () => {
            const fake = new FakeMagicQLightingExecutor();
            const missingWorkspace = await executeMagicQFixtureIntensityCapability(
              fake,
              undefined,
              {},
            );
            const malformed = await executeMagicQFixtureIntensityCapability(
              fake,
              "workspace-1",
              { connectionId: "connection-1" },
            );
            assert.equal(missingWorkspace.success, false);
            assert.equal(malformed.success, false);
            assert.equal(fake.requests.length, 0);
          });
          EOF
      - run: npx tsx --test src/tests/integration/magicq-capability-engine.test.ts src/tests/integration/magicq-crep.test.ts src/tests/integration/magicq-adapter-v1.test.ts src/tests/integration/magicq-universal-connections.test.ts
      - run: npx tsc --noEmit --pretty false
      - run: npm run build
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/capabilities/capability-engine.ts src/tests/integration/magicq-capability-engine.test.ts
          git commit -m "feat(magicq): wire governed Lighting capability into engine [magicq-wire]"
          git push
