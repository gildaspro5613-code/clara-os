name: Make on-demand connector isolation
on:
  pull_request:
    paths:
      - 'src/lib/connectors/make/**'
      - 'src/lib/connectors/core/native-connector-builder-*'
      - 'src/lib/connectors/core/native-connector-read-gateway.ts'
      - 'src/lib/capabilities/make-scenario/**'
      - 'src/lib/capabilities/capability-registry.ts'
      - 'src/lib/brain/brain-source-registry.ts'
      - 'src/tests/make-native-calendar-*'
      - 'src/tests/helpers/make-calendar-*'
      - 'src/tests/make-on-demand-contract.test.ts'
      - 'src/tests/make-native-read-handoff.test.ts'
      - 'src/tests/make-native-admin-command.test.ts'
      - 'src/tests/make-scenario-catalog-inventory.test.ts'
      - 'docs/operations/native-make-scenario-catalog-clone-recipe.sql'
      - 'src/lib/native/make-admin-command.ts'
      - 'docs/operations/native-make-admin-command-clone-candidate.sql'
      - 'src/lib/native/make-read-handoff.ts'
      - 'src/lib/native/make-read-authority.ts'
      - 'docs/operations/native-make-read-authority-proposal.sql'
      - '.github/workflows/make-on-demand-reception.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  make-reception:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Isolated Make API on-demand and existing webhook contract
        run: node --import tsx --test src/tests/make-on-demand-contract.test.ts src/tests/make-connector.test.ts src/tests/make-native-read-handoff.test.ts src/tests/make-native-admin-command.test.ts src/tests/make-scenario-catalog-inventory.test.ts
      - name: Native Calendar and preserved Drive READ — network denied
        run: >-
          node --import ./src/tests/helpers/make-calendar-offline.mjs --import tsx --test
          src/tests/make-native-calendar-activation-blocked.test.ts
          src/tests/make-native-calendar-contract.test.ts
          src/tests/make-native-calendar-read.test.ts
          src/tests/make-native-calendar-selection.test.ts
          src/tests/make-native-drive-input.test.ts
          src/tests/make-native-selector-contract.test.ts
          src/tests/connector-builder-native-selection.test.ts
          src/tests/connector-builder-native-gateway.test.ts
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Lint changed files
        run: npx eslint src/lib/connectors/make/types.ts src/lib/connectors/make/client.ts src/lib/connectors/make/on-demand-client.ts src/lib/connectors/make/adapter.ts src/tests/make-on-demand-contract.test.ts src/tests/make-native-read-handoff.test.ts src/lib/native/make-read-handoff.ts src/lib/native/make-read-authority.ts src/lib/native/make-admin-command.ts src/tests/make-native-admin-command.test.ts src/tests/make-scenario-catalog-inventory.test.ts
      - name: Calendar READ targeted lint
        run: >-
          npx eslint src/lib/connectors/make/native-calendar-*.ts
          src/lib/connectors/make/definition.ts src/lib/connectors/make/types.ts
          src/lib/capabilities/make-scenario/capability.ts src/lib/capabilities/capability-registry.ts
          src/lib/connectors/core/native-connector-builder-runtime.ts
          src/lib/connectors/core/native-connector-builder-selection.ts
          src/lib/connectors/core/native-connector-read-gateway.ts src/lib/brain/brain-source-registry.ts
          src/tests/make-native-calendar-*.test.ts src/tests/helpers/make-calendar-fixture.ts
          src/tests/helpers/make-calendar-offline.mjs
