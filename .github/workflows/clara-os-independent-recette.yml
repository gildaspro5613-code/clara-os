name: Clara OS independent project recette deployment
run-name: "Isolated recette project — ${{ github.actor }}"
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify source, project and custom Environment only; do not deploy
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: clara-os-independent-recette
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: clara-os-recette
    timeout-minutes: 20
    steps:
      - name: Enforce manual invocation
        run: |
          test "${{ github.event_name }}" = workflow_dispatch
          test "${{ github.repository }}" = gildaspro5613-code/clara-os
      - name: Refuse write requests during transport preparation
        if: ${{ inputs.verify_only != true }}
        run: |
          echo "::error::REST_WRITES_DISABLED — separate authorization and reviewed activation required"
          exit 1
      - name: Checkout approved source (never main)
        uses: actions/checkout@v4
        with:
          ref: 6cfed8f80f9b8451d5698ca1040bcf42d513c4f2
          persist-credentials: false
          fetch-depth: 2
      - name: Verify pinned Git source (no local artifact transformation)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6cfed8f80f9b8451d5698ca1040bcf42d513c4f2"
          test "$(git remote get-url origin)" = "https://github.com/gildaspro5613-code/clara-os"
          test "$(git cat-file -t 6cfed8f80f9b8451d5698ca1040bcf42d513c4f2)" = commit
          test "$(git rev-parse 6cfed8f80f9b8451d5698ca1040bcf42d513c4f2^)" = "b2a51dd59381daa1e5d3278f3d7104b986015170"
          test "$(git diff --name-only b2a51dd59381daa1e5d3278f3d7104b986015170 6cfed8f80f9b8451d5698ca1040bcf42d513c4f2)" = vercel.json
      - name: Set up deployment controller Node.js
        if: ${{ false }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve and strictly verify independent project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_RECETTE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "::error::Dedicated VERCEL_RECETTE_TOKEN is missing; no fallback allowed"; exit 1; }
          status=$(curl --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/clara-os-recette?teamId=team_0BeqOAO8t5oDEBdzHHdekcxv" \
            --output "$RUNNER_TEMP/recette-project.json" --write-out '%{http_code}')
          node - "$RUNNER_TEMP/recette-project.json" "$status" <<'NODE'
          const fs = require('fs');
          const status = /^[0-9]{3}$/.test(process.argv[3]) ? process.argv[3] : '000';
          let p;
          try { p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')); }
          catch { p = {}; }
          if (status !== '200') {
            // Publish only allowlisted provider literals. Never publish a raw body,
            // credential, header, URL with credentials, or reflected token.
            const codes = new Set(['forbidden','unauthorized','not_found','invalid_token',
              'token_expired','missing_authentication_token','bad_request']);
            const code = codes.has(p.error?.code) ? p.error.code : 'UNCLASSIFIED';
            const raw = typeof p.error?.message === 'string' ? p.error.message : '';
            const token = process.env.VERCEL_TOKEN;
            let message = raw;
            // Exact-secret removal precedes bounded generic redaction. Only the
            // error message is considered; never log the response body or headers.
            if (token) for (const value of [token, encodeURIComponent(token)]) {
              message = message.split(value).join('[REDACTED]');
            }
            message = message.replace(/https?:\/\/[^\s]+/g, '[URL REDACTED]')
              .replace(/[A-Za-z0-9_.~+\/-]{20,}/g, '[OPAQUE REDACTED]')
              .replace(/[\x00-\x1f\x7f]/g, ' ').slice(0, 400) || 'PROVIDER_MESSAGE_ABSENT';
            const result = `VERCEL_PROJECT_CHECK_REFUSED HTTP=${status} code=${code} message=${message}`;
            console.log('::error title=Recette project metadata::' + result.replaceAll('%','%25'));

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, result + '\n');
            process.exit(1);
          }
          if (p.accountId !== 'team_0BeqOAO8t5oDEBdzHHdekcxv' ||
              p.name !== 'clara-os-recette' || p.id !== 'prj_lgt74rXSoT2jPHDkC1Yw1y2TWdxz' ||
              p.id === 'prj_jLIZqU5V98I4yl8RCbAaoqgM4KNJ') {
            throw new Error('Independent project identity verification failed');
          }
          if (p.link || p.gitRepository) {
            console.log('::error title=Recette Git isolation::RECETTE_LINKED_PROJECT_REFUSED');
            process.exit(1);
          }
          console.log('::notice title=Recette Git isolation::RECETTE_UNLINKED_PROJECT_VERIFIED');
          fs.mkdirSync('.vercel', {recursive:true});
          fs.writeFileSync('.vercel/project.json', JSON.stringify({
            projectId:p.id,orgId:'team_0BeqOAO8t5oDEBdzHHdekcxv'
          }));
          console.log('Independent unlinked project identity verified; production project excluded');
          NODE
      - name: Strictly verify custom recette Environment (read-only)
        env:
          VERCEL_RECETTE_TOKEN: ${{ secrets.VERCEL_RECETTE_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE_PREFLIGHT'
          import {appendFileSync} from 'node:fs';
          export async function verifyCustomEnvironment({token,http = fetch}) {
            if (!token) throw new Error('DEDICATED_RECETTE_TOKEN_REQUIRED');
            const projectId = 'prj_lgt74rXSoT2jPHDkC1Yw1y2TWdxz';
            const teamId = 'team_0BeqOAO8t5oDEBdzHHdekcxv';
            const environmentId = 'env_T6nc8Pd4KLG9qTbvTM9ZsOn4T4YM';
            const slug = 'clara-os-recette';
            async function read(path) {
              const url = new URL(path,'https://api.vercel.com');
              url.searchParams.set('teamId',teamId);
              let response;
              try {
                response = await http(url,{method:'GET',redirect:'error',signal:AbortSignal.timeout(30000),headers:{Authorization:'Bearer ' + token}});
              } catch { throw new Error('PREFLIGHT_TRANSPORT_REFUSED'); }
              if (!response.ok) throw new Error('PREFLIGHT_HTTP_' + response.status);
              try { return await response.json(); }
              catch { throw new Error('PREFLIGHT_RESPONSE_REFUSED'); }
            }
            const project = await read('/v9/projects/' + projectId);
            if (project.id !== projectId || project.accountId !== teamId || project.name !== slug || project.link || project.gitRepository) throw new Error('PREFLIGHT_PROJECT_REFUSED');
            // Project ID is part of the endpoint, not inferred from an Environment name.
            const data = await read('/projects/' + projectId + '/custom-environments');
            if (!Array.isArray(data.environments)) throw new Error('PREFLIGHT_ENVIRONMENT_REFUSED');
            const matches = data.environments.filter(e => e?.id === environmentId || e?.slug === slug);
            if (matches.length !== 1 || matches[0].id !== environmentId || matches[0].slug !== slug) throw new Error('PREFLIGHT_ENVIRONMENT_REFUSED');
            if (matches[0].projectId !== undefined && matches[0].projectId !== projectId) throw new Error('PREFLIGHT_ENVIRONMENT_REFUSED');
            return {projectId,teamId,environmentId,slug};
          }
          if (process.argv[1] === '-') {
            try {
              const result = await verifyCustomEnvironment({token:process.env.VERCEL_RECETTE_TOKEN});
              const message = 'READ_ONLY_BINDINGS_PASS ' + JSON.stringify(result) + ' WRITE_PERMISSIONS_NON_ATTESTED';
              console.log('::notice title=Recette read-only Environment::' + message);
              appendFileSync(process.env.GITHUB_STEP_SUMMARY,message + '\n');
            } catch (error) {
              const code = /^(DEDICATED_RECETTE_TOKEN_REQUIRED|PREFLIGHT_(HTTP_[0-9]{3}|TRANSPORT_REFUSED|RESPONSE_REFUSED|PROJECT_REFUSED|ENVIRONMENT_REFUSED))$/.test(error?.message) ? error.message : 'PREFLIGHT_REFUSED';
              console.log('::error title=Recette read-only Environment::' + code);
              process.exitCode = 1;
            }
          }
          NODE_PREFLIGHT
      - name: Deploy only custom recette environment through official REST API
        if: ${{ false }}
        env:
          VERCEL_RECETTE_TOKEN: ${{ secrets.VERCEL_RECETTE_TOKEN }}
        run: |
          set -euo pipefail
          test "${{ github.run_attempt }}" = "1" || { echo "::error::Deployment rerun refused; inspect previous outcome and obtain new authorization"; exit 1; }
          node --input-type=module - <<'NODE_API'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';

          export const expected = Object.freeze({
            sha: '6cfed8f80f9b8451d5698ca1040bcf42d513c4f2',
            baseSha: 'b2a51dd59381daa1e5d3278f3d7104b986015170',
            project: 'prj_lgt74rXSoT2jPHDkC1Yw1y2TWdxz',
            team: 'team_0BeqOAO8t5oDEBdzHHdekcxv',
            environment: 'env_T6nc8Pd4KLG9qTbvTM9ZsOn4T4YM',
            slug: 'clara-os-recette',
          });
          class Refused extends Error {}
          const refuse = code => { throw new Refused(code); };
          const gitRead = args => execFileSync('git', args, {maxBuffer:32 * 1024 * 1024,stdio:['ignore','pipe','pipe']});

          /** Verify the isolated Git descendant; never rewrite tracked bytes or read local secrets. */
          export function verifyApprovedSource(git = gitRead) {
            if (String(git(['rev-parse','HEAD'])).trim() !== expected.sha) refuse('SOURCE_SHA_REFUSED');
            if (String(git(['remote','get-url','origin'])).trim() !== 'https://github.com/gildaspro5613-code/clara-os') refuse('SOURCE_REPOSITORY_REFUSED');
            if (String(git(['cat-file','-t',expected.sha])).trim() !== 'commit') refuse('SOURCE_COMMIT_REFUSED');
            if (String(git(['rev-parse',expected.sha + '^'])).trim() !== expected.baseSha) refuse('SOURCE_PARENT_REFUSED');
            if (String(git(['diff','--name-only',expected.baseSha,expected.sha])).trim() !== 'vercel.json') refuse('SOURCE_BUSINESS_DIFF_REFUSED');
            let config,original;
            try {
              config = JSON.parse(git(['show',expected.sha + ':vercel.json']));
              original = JSON.parse(git(['show',expected.baseSha + ':vercel.json']));
            }
            catch { refuse('CRON_CONFIGURATION_REFUSED'); }
            // No undocumented API override and no reliance on a missing CRON_SECRET.
            // Only this isolated Git descendant removes the declarations; PR/Production keep them.
            if (config.crons !== undefined && (!Array.isArray(config.crons) || config.crons.length !== 0)) refuse('SOURCE_CRONS_PRESENT_NO_DEPLOYMENT');
            if (!Array.isArray(original.crons) || original.crons.length !== 2) refuse('SOURCE_BASE_CRONS_REFUSED');
            delete original.crons;
            if (JSON.stringify(config) !== JSON.stringify(original)) refuse('SOURCE_CONFIGURATION_DIFF_REFUSED');

          }

          export function approvedFiles(git = gitRead) {
            verifyApprovedSource(git);
            const entries = String(git(['ls-tree','-r','-z',expected.sha])).split('\0').filter(Boolean);
            const files = entries.map(entry => {
              const match = /^(100644|100755) blob [a-f0-9]{40}\t(.+)$/.exec(entry);
              if (!match) refuse('SOURCE_FILE_TYPE_REFUSED');
              const file = match[2];
              if (file.startsWith('/') || file.split('/').some(p => p === '..' || p === '.git' || p === '.vercel' || p === '.env' || p.startsWith('.env.') || p === '.npmrc')) refuse('SOURCE_FILE_PATH_REFUSED');
              const data = Buffer.from(git(['show',expected.sha + ':' + file]));
              return {file,data,sha:createHash('sha1').update(data).digest('hex'),size:data.length};
            });
            if (!['package.json','package-lock.json','vercel.json'].every(name => files.some(f => f.file === name))) refuse('SOURCE_MANIFEST_REFUSED');
            return files;
          }


          /** Single-purpose official REST client. No CLI, user lookup, alternate token,
           * project creation, environment mutation, or automatic POST retry.
           */
          export async function deployRecette({token,http = fetch,git = gitRead,wait = () => new Promise(r => setTimeout(r,5000)),emit = () => {},writesAuthorized = false}) {
            if (writesAuthorized !== true) refuse('REST_WRITES_DISABLED');
            if (!token) refuse('DEDICATED_RECETTE_TOKEN_REQUIRED');
            const files = approvedFiles(git);
            async function call(path,{method = 'GET',body,headers = {},json = true} = {}) {
              const url = new URL(path,'https://api.vercel.com');
              url.searchParams.set('teamId',expected.team);
              let response;
              try {
                response = await http(url,{method,redirect:'error',signal:AbortSignal.timeout(30000),headers:{Authorization:'Bearer ' + token,...headers},body});
              } catch {
                refuse(method === 'POST' ? (path === '/v2/files' ? 'UPLOAD' : 'CREATE') + '_OUTCOME_UNCERTAIN_NO_RETRY' : 'API_TRANSPORT_REFUSED');
              }
              if (!response.ok) {
                const kind = path === '/v2/files' ? 'UPLOAD' : path === '/v13/deployments' ? 'CREATE' : 'METADATA';
                if (method === 'POST' && (response.status >= 500 || response.status === 408)) refuse(kind + '_HTTP_' + response.status + '_OUTCOME_UNCERTAIN_NO_RETRY');
              refuse(kind + '_HTTP_' + response.status);
              }
              try {
                if (!json) {
                  if (response.status !== 200) refuse('UPLOAD_HTTP_' + response.status + '_OUTCOME_UNCERTAIN_NO_RETRY');
                  await response.arrayBuffer();return;
                }
                return await response.json();
              } catch (error) {
                if (error instanceof Refused) throw error;
                refuse(method === 'POST' ? (path === '/v2/files' ? 'UPLOAD' : 'CREATE') + '_OUTCOME_UNCERTAIN_NO_RETRY' : 'API_RESPONSE_REFUSED');
              }
            }
            const project = await call('/v9/projects/' + expected.project);
            if (project.id !== expected.project || project.name !== expected.slug || project.accountId !== expected.team || project.link || project.gitRepository) refuse('PROJECT_IDENTITY_REFUSED');
            const environments = await call('/projects/' + expected.project + '/custom-environments');
            if (!Array.isArray(environments.environments)) refuse('CUSTOM_ENVIRONMENT_REFUSED');
            const matches = environments.environments.filter(e => e.id === expected.environment || e.slug === expected.slug);
            if (matches.length !== 1 || matches[0].id !== expected.environment || matches[0].slug !== expected.slug || (matches[0].projectId !== undefined && matches[0].projectId !== expected.project)) refuse('CUSTOM_ENVIRONMENT_REFUSED');

            // Sequential uploads: no in-flight writes remain when a refusal occurs.
            const unique = new Map();
            for (const file of files) {
              const previous = unique.get(file.sha);
              if (previous && !previous.data.equals(file.data)) refuse('SOURCE_DIGEST_COLLISION_REFUSED');
              unique.set(file.sha,file);
            }
            for (const file of unique.values()) {
              await call('/v2/files',{method:'POST',body:file.data,json:false,headers:{'Content-Type':'application/octet-stream','Content-Length':String(file.size),'x-vercel-digest':file.sha,'x-now-size':String(file.size)}});
            }
            // Exactly one create; never reuse an uncertain request automatically.
            const deployment = await call('/v13/deployments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
              name:expected.slug,project:expected.project,customEnvironmentSlugOrId:expected.environment,
              files:files.map(({file,sha,size}) => ({file,sha,size})),
              meta:{githubCommitSha:expected.sha,recetteSourceSha:expected.sha},
            })});
            const safeIdentity = d => {
              if (!/^dpl_[A-Za-z0-9]+$/.test(d.id ?? '') || !/^clara-os-recette-[a-z0-9]+-melodie-digital\.vercel\.app$/.test(d.url ?? '')) refuse('CREATED_DEPLOYMENT_IDENTITY_UNCERTAIN_NO_RETRY');
              return {id:d.id,url:'https://' + d.url,sourceSha:expected.sha};
            };
            const identity = safeIdentity(deployment);
            emit({event:'CREATED_NOT_YET_CERTIFIED',...identity});
            const verify = d => {
              if (d.id !== identity.id || 'https://' + d.url !== identity.url || d.ownerId !== expected.team || d.projectId !== expected.project || d.target === 'production' ||
                  d.customEnvironment?.id !== expected.environment || d.customEnvironment?.slug !== expected.slug || d.meta?.githubCommitSha !== expected.sha) refuse('DEPLOYMENT_BINDING_UNCERTAIN_NO_RETRY');
            };
            let current = deployment;
            for (let attempt = 0;attempt < 120;attempt++) {
              verify(current);
              if (current.readyState === 'READY') {
                const result = {event:'READY',...identity,environment:expected.slug};emit(result);return result;
              }
              if (['ERROR','CANCELED'].includes(current.readyState)) refuse('DEPLOYMENT_' + current.readyState + '_NO_RETRY');
              await wait();
              current = await call('/v13/deployments/' + identity.id);
            }
            refuse('DEPLOYMENT_NOT_READY_NO_RETRY');
          }

          // Imported by offline tests. Writes stay disabled here and in the workflow until reviewed activation.
          if (process.argv[1] === '-') {
            try {
              await deployRecette({writesAuthorized:false,token:process.env.VERCEL_RECETTE_TOKEN,emit:result => {
                const line = JSON.stringify(result);
                console.log('::notice title=Recette deployment::' + line);
                if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY,line + '\n');
              }});
            } catch (error) {
              const code = error instanceof Refused ? error.message : 'DEPLOYMENT_DRIVER_FAILED';
              console.error('::error title=Recette deployment::' + code);
              process.exitCode = 1;
            }
          }
          NODE_API
