name: MagicQ Connections Check

on:
  push:
    branches:
      - feat/magicq-universal-connections-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx --test src/tests/integration/magicq-crep.test.ts src/tests/integration/magicq-adapter-v1.test.ts src/tests/integration/magicq-universal-connections.test.ts
      - run: npx tsc --noEmit --pretty false
      - run: npm run build
